<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Engavetados - Caso 4</title>
<style>
@font-face{font-family:Anton;src:url(anton.woff2) format("woff2")}
@font-face{font-family:Marker;src:url(marker.woff2) format("woff2")}
:root{--bg:#1E2633;--panel:#2A3446;--y:#ECC94B;--r:#E53E3E;--paper:#F3E9C6;--ink:#12161E;--tx:#F5F1E6;--mu:#8A94A6;--g:#7BC47F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;background:#0c0f15;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:var(--bg);font-family:Anton,Impact,sans-serif;color:var(--tx);text-transform:uppercase}
.sc{position:absolute;inset:0;opacity:0}
.abs{position:absolute;transform-origin:center center}
.t{position:absolute;left:0;width:720px;text-align:center;line-height:1}
.ls{letter-spacing:.06em}
.card{position:absolute;background:var(--panel);border:3px solid #3a465c;border-radius:18px}
.paper{position:absolute;background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 10px 30px #0008}
.mk{font-family:Marker,cursive;text-transform:none}
#hud{position:absolute;left:0;top:0;width:720px;height:96px;z-index:30;background:linear-gradient(#0c0f15f0,#0c0f1500)}
#cap{position:absolute;left:30px;width:660px;top:902px;height:130px;z-index:30;text-align:center;font-size:62px;line-height:1.08;letter-spacing:.03em;-webkit-text-stroke:0;text-shadow:0 4px 0 #000,0 0 14px #000c,3px 3px 0 #000,-3px 3px 0 #000}
#cap span{display:inline-block;margin:0 9px;color:#fff;transition:none}
#cap span.on{color:var(--y);transform:scale(1.07)}
#noise{position:absolute;inset:0;z-index:40;opacity:.07;pointer-events:none;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;z-index:41;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#000a 100%)}
#cover{position:absolute;inset:0;z-index:60;background:var(--bg)}
#endc{position:absolute;inset:0;z-index:50;background:var(--bg);opacity:0}
</style></head><body>
<div id="stage">
<div id="scenes"></div>
<div id="hud">
  <div class="abs" style="left:28px;top:26px;display:flex;align-items:center;gap:12px">
    <svg width="34" height="28" viewBox="0 0 34 28"><path d="M0 4h12l3 4h19v20H0z" fill="#ECC94B"/><path d="M0 10h34v18H0z" fill="#F2D567"/></svg>
    <div style="font-size:30px;letter-spacing:.1em">ENGAVETADOS</div></div>
  <div class="abs" style="right:28px;top:26px;font-size:30px;letter-spacing:.1em;color:var(--y)">CASO #4</div>
  <div id="prog" class="abs" style="left:0;top:90px;height:5px;width:0;background:var(--y)"></div>
</div>
<div id="cap"></div>
<div id="endc"></div>
<svg id="noise" width="720" height="1280"><filter id="nf"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#nf)"/></svg>
<div id="vig"></div><div id="mk0" style="position:absolute;left:0;bottom:0;width:720px;height:40px;background:#ff00ff;z-index:99;display:none"></div>
<div id="cover">
  <div class="abs" style="left:60px;top:150px;width:600px;height:900px">
    <svg width="600" height="900" viewBox="0 0 600 900">
      <path d="M0 40 Q0 0 40 0 H220 Q250 0 265 30 L285 70 H560 Q600 70 600 110 V860 Q600 900 560 900 H40 Q0 900 0 860Z" fill="#D9B53A"/>
      <path d="M0 110 Q0 70 40 70 H560 Q600 70 600 110 V860 Q600 900 560 900 H40 Q0 900 0 860Z" fill="#ECC94B"/>
      <rect x="40" y="130" width="520" height="10" fill="#C99F25"/>
    </svg>
    <div class="t" style="left:0;width:600px;top:175px;font-size:44px;letter-spacing:.2em;color:#12161E">CASO #4</div>
    <div class="t" style="left:0;width:600px;top:250px;font-size:126px;line-height:.98;color:#12161E">MÁSCARAS<br>DE CHUMBO</div>
    <div class="t" style="left:0;width:600px;top:545px;font-size:44px;letter-spacing:.14em;color:#12161E">BRASIL · 1966</div>
    <div class="abs" style="left:70px;top:680px;width:460px;padding:6px 0;border:9px solid #E53E3E;border-radius:10px;text-align:center;font-size:66px;white-space:nowrap;color:#E53E3E;transform:rotate(-7deg);letter-spacing:.05em">SEM SOLUÇÃO</div>
    <div class="t" style="left:0;width:600px;top:862px;font-size:24px;letter-spacing:.28em;color:#12161EAA">ENGAVETADOS | CASOS REAIS</div>
  </div>
</div>
</div>
<script src="timing.js"></script>
<script>
const LEAD=0.6, TOTAL=TM.dur+LEAD, END=TOTAL+2.6;
const W=TM.words, BS=[]; W.forEach(w=>(BS[w.s]=BS[w.s]||[]).push(w));
const wt=(j,k)=>BS[j][Math.min(k,BS[j].length-1)].t0+LEAD;
const we=(j,k)=>BS[j][Math.min(k,BS[j].length-1)].t1+LEAD;
const ss=j=>TM.sents[j].t0+LEAD, se=j=>TM.sents[j].t1+LEAD;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=(id)=>document.getElementById(id);
function pop(el,t,a,d=.38){const p=pr(t,a,a+d);el.style.opacity=p>0?Math.min(1,p*3):0;el.style.transform=(el.dataset.b||'')+` scale(${p>0?Math.max(0,eb(p)):0})`}
function fade(el,t,a,b,d=.3){el.style.opacity=Math.min(pr(t,a,a+d),1-pr(t,b-d,b))}
function slide(el,t,a,dx,dy,d=.5){const p=eo(pr(t,a,a+d));el.style.opacity=Math.min(1,p*3);el.style.transform=(el.dataset.b||'')+` translate(${dx*(1-p)}px,${dy*(1-p)}px)`}
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const scenes=[];
function scene(a,b,html,upd){const d=document.createElement('div');d.className='sc';d.innerHTML=html;$('scenes').appendChild(d);
  const q=id=>d.querySelector('#'+id);scenes.push({a,b,d,upd:upd(q,d)});}
const plane=(w,c='#0A0D13')=>`<svg width="${w}" viewBox="0 0 200 64"><g fill="${c}"><path d="M10 32Q10 25 30 25H150Q185 27 196 32Q185 37 150 39H30Q10 39 10 32Z"/><path d="M18 27L6 4H32L46 25Z"/><path d="M84 36L112 60H130L116 36Z"/><path d="M88 26L112 4H126L110 26Z"/><rect x="26" y="30" width="22" height="7" rx="3"/></g><g fill="#ECC94B" opacity=".9">${[...Array(12)].map((_,i)=>`<circle cx="${60+i*9}" cy="29" r="1.8"/>`).join('')}</g></svg>`;
const para=(w,c='#F5F1E6')=>`<svg width="${w}" viewBox="0 0 90 100"><path d="M5 45A40 40 0 0 1 85 45Q65 35 45 45Q25 35 5 45Z" fill="${c}"/><path d="M5 45L40 88M85 45L50 88M45 45L45 88" stroke="${c}" stroke-width="2" fill="none"/><rect x="36" y="86" width="18" height="12" rx="3" fill="${c}"/></svg>`;
const person=(w,c)=>`<svg width="${w}" viewBox="0 0 30 40"><circle cx="15" cy="9" r="7" fill="${c}"/><path d="M3 38Q3 18 15 18Q27 18 27 38Z" fill="${c}"/></svg>`;
const bill=(w,h=w*.5)=>`<div style="width:${w}px;height:${h}px;background:#7BC47F;border:3px solid #2E6B3A;border-radius:6px;position:relative;box-shadow:0 4px 0 #2E6B3A"><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${h*.55}px;height:${h*.55}px;border-radius:50%;border:3px solid #2E6B3A;background:#9AD6A0"></div></div>`;
const stamp=(txt,col,fs,extra='')=>`<div class="abs" style="padding:4px 22px;border:9px solid ${col};border-radius:10px;color:${col};font-size:${fs}px;letter-spacing:.06em;white-space:nowrap;${extra}">${txt}</div>`;

const sky=`<div class="abs" style="left:0;top:0;width:720px;height:1280px;background:linear-gradient(#050810,#0F1A2A 55%,#0A0F17)"></div>`;
const stars=n=>[...Array(n)].map((_,i)=>`<div class="abs" style="left:${(i*229+i*i*41)%700}px;top:${110+(i*131+i*i*17)%420}px;width:${2+i%3}px;height:${2+i%3}px;border-radius:50%;background:#fff;opacity:${.25+(i%5)*.1}"></div>`).join('');
const hill=(top)=>`<svg class="abs" style="left:0;top:${top}px" width="720" height="${1280-top}" viewBox="0 0 720 ${1280-top}"><path d="M0 110Q170 10 360 55T720 30V${1280-top}H0Z" fill="#070A10"/><path d="M0 110Q170 10 360 55T720 30" stroke="#1d2a3f" stroke-width="4" fill="none"/></svg>`;
const man=(l,t,mid)=>`<div class="abs" style="left:${l}px;top:${t}px;transform:scale(1.3);transform-origin:0 0"><svg width="230" height="70" viewBox="0 0 230 70"><rect x="0" y="22" width="160" height="40" rx="12" fill="#1b2433" stroke="#2b3a52" stroke-width="3"/><rect x="40" y="22" width="14" height="40" fill="#F5F1E6"/><circle cx="188" cy="40" r="26" fill="#D9B79A"/></svg><div id="${mid}" class="abs" style="left:158px;top:30px;width:62px;height:22px;border-radius:9px;background:linear-gradient(#a7b0bf,#6f7a8c);border:3px solid #12161E;opacity:0"></div></div>`;
const moon=(l,t,s=90)=>`<div class="abs" style="left:${l}px;top:${t}px;width:${s}px;height:${s}px;border-radius:50%;background:#F5F1E6;box-shadow:0 0 50px #F5F1E644"></div>`;
const orb=(id,l,t,s)=>`<div id="${id}" class="abs" style="left:${l}px;top:${t}px;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(#FFD08A 0%,#F6993F 30%,#F6993F55 55%,transparent 72%);opacity:0"></div>`;

/* A: dois homens, máscaras */
scene(0,se(1),`${sky}${stars(30)}${moon(560,150)}${hill(520)}
<div class="abs" style="left:0;top:0">${man(60,600,'m1')}${man(375,600,'m2')}</div>
<div id="lbl" class="t" style="top:300px;font-size:60px;letter-spacing:.2em;color:var(--mu)">NITERÓI · RJ</div>`,
(q)=>{const m1=q('m1'),m2=q('m2'),lb=q('lbl');m1.dataset.b='';m2.dataset.b='';
 return t=>{pop(m1,t,wt(1,1),.3);pop(m2,t,wt(1,1)+.15,.3);lb.style.opacity=0}});

/* B: agosto de 1966 */
scene(se(1),se(3),`${sky}${stars(24)}
<div id="ag" class="t" style="top:190px;font-size:96px;letter-spacing:.3em;color:var(--mu)">AGOSTO</div>
<div id="yr" class="t" style="top:310px;font-size:330px;color:var(--y);text-shadow:0 8px 0 #000">1966</div>
<div id="pn" class="abs" style="left:0;top:700px;width:720px;text-align:center;font-size:76px;letter-spacing:.06em;white-space:nowrap"><span style="color:var(--r)">●</span> NITERÓI · RJ</div>`,
(q)=>{const ag=q('ag'),yr=q('yr'),pn=q('pn');
 return t=>{pop(ag,t,wt(2,0),.35);pop(yr,t,wt(2,5),.4);pop(pn,t,wt(3,0),.35)}});

/* C: os dois técnicos */
scene(se(3),se(4),`${sky}
<div id="c1" class="paper" style="left:60px;top:190px;width:600px;height:230px"><div class="t" style="left:0;width:600px;top:24px;font-size:36px;letter-spacing:.25em;color:#5a5f6c">TÉCNICO EM ELETRÔNICA</div><div class="t" style="left:0;width:600px;top:90px;font-size:72px;color:var(--ink)">MIGUEL JOSÉ VIANA</div></div>
<div id="c2" class="paper" style="left:60px;top:460px;width:600px;height:230px"><div class="t" style="left:0;width:600px;top:24px;font-size:36px;letter-spacing:.25em;color:#5a5f6c">TÉCNICO EM ELETRÔNICA</div><div class="t" style="left:0;width:600px;top:96px;font-size:58px;color:var(--ink)">MANOEL PEREIRA DA CRUZ</div></div>
<div id="cg" class="t" style="top:745px;font-size:56px;letter-spacing:.08em;color:var(--y)">CAMPOS DOS GOYTACAZES</div>`,
(q)=>{const c1=q('c1'),c2=q('c2'),cg=q('cg');c1.dataset.b='';c2.dataset.b='';
 return t=>{pop(c1,t,wt(4,0)-.05,.4);pop(c2,t,wt(4,4)-.05,.4);pop(cg,t,wt(4,12),.35)}});

/* D: dia 17, ônibus, compras */
const coat=`<svg width="150" height="190" viewBox="0 0 150 190"><path d="M30 60Q75-10 120 60L140 180H10Z" fill="#ECC94B" stroke="#12161E" stroke-width="6"/><path d="M75 60V180" stroke="#12161E" stroke-width="5"/><circle cx="75" cy="30" r="22" fill="#D9B79A" opacity="0"/></svg>`;
const bottle=`<svg width="80" height="190" viewBox="0 0 80 190"><rect x="28" y="0" width="24" height="30" rx="6" fill="#8A94A6"/><path d="M22 30H58L70 60V175Q70 186 58 186H22Q10 186 10 175V60Z" fill="#7cc4ff66" stroke="#cfeaff" stroke-width="5"/></svg>`;
const bus=`<svg width="460" height="220" viewBox="0 0 460 220"><rect x="10" y="20" width="440" height="150" rx="26" fill="#E5B84B" stroke="#12161E" stroke-width="6"/>${[0,1,2,3,4].map(i=>`<rect x="${34+i*78}" y="46" width="62" height="54" rx="8" fill="#1d2a3f"/>`).join('')}<rect x="10" y="120" width="440" height="14" fill="#B3862B"/><circle cx="110" cy="176" r="32" fill="#12161E"/><circle cx="110" cy="176" r="12" fill="#8A94A6"/><circle cx="350" cy="176" r="32" fill="#12161E"/><circle cx="350" cy="176" r="12" fill="#8A94A6"/></svg>`;
scene(se(4),se(7),`${sky}${stars(16)}
<div id="g1" class="abs" style="left:0;top:0;width:720px;height:1000px"><div id="d17" class="t" style="top:170px;font-size:220px;color:var(--y);text-shadow:0 8px 0 #000">17 AGO</div><div id="mt" class="paper" style="left:80px;top:520px;width:560px;height:210px"><div class="t" style="left:0;width:560px;top:26px;font-size:34px;letter-spacing:.25em;color:#5a5f6c">DISSERAM À FAMÍLIA</div><div class="t" style="left:0;width:560px;top:80px;font-size:70px;line-height:1.05;color:var(--ink)">COMPRAR MATERIAL<br>DE TRABALHO</div></div></div>
<div id="g2" class="abs" style="left:0;top:0;width:720px;height:1000px;opacity:0"><div class="abs" style="left:0;top:760px;width:720px;height:10px;background:repeating-linear-gradient(90deg,#8A94A6 0 40px,transparent 40px 80px)"></div><div id="bs" class="abs" style="left:130px;top:520px">${bus}</div><div class="t" style="top:200px;font-size:110px;color:var(--tx)">DE ÔNIBUS</div><div class="t" style="top:340px;font-size:80px;letter-spacing:.12em;color:var(--y)">PARA NITERÓI</div></div>
<div id="g3" class="abs" style="left:0;top:0;width:720px;height:1000px;opacity:0"><div id="k1" class="abs" style="left:110px;top:300px">${coat}</div><div id="k2" class="abs" style="left:290px;top:300px">${coat}</div><div id="k3" class="abs" style="left:500px;top:300px">${bottle}</div><div class="t" style="top:170px;font-size:56px;letter-spacing:.25em;color:var(--mu)">COMPRAS</div><div id="kt" class="t" style="top:560px;font-size:70px;line-height:1.05">2 CAPAS DE CHUVA<br><span style="color:var(--y)">1 GARRAFA DE ÁGUA</span></div></div>`,
(q)=>{const g1=q('g1'),g2=q('g2'),g3=q('g3'),d17=q('d17'),mt=q('mt'),bs=q('bs'),k1=q('k1'),k2=q('k2'),k3=q('k3'),kt=q('kt');mt.dataset.b='';
 return t=>{const a=pr(t,ss(6)-.05,ss(6)+.25),b=pr(t,ss(7)-.05,ss(7)+.25);
  g1.style.opacity=1-a;g2.style.opacity=a*(1-b);g3.style.opacity=b;
  pop(d17,t,wt(5,1),.4);pop(mt,t,wt(5,8)-.1,.4);
  const p=eo(pr(t,ss(6),se(6)));bs.style.transform=`translateX(${(p-.5)*80}px) translateY(${Math.sin(t*14)*3}px)`;
  pop(k1,t,wt(7,2),.35);pop(k2,t,wt(7,2)+.15,.35);pop(k3,t,wt(7,7),.35);pop(kt,t,wt(7,3),.35)}});

/* E: garçonete, relógio, última vez */
scene(se(7),se(10),`${sky}
<div class="t" style="top:150px;font-size:40px;letter-spacing:.2em;color:var(--mu)">TESTEMUNHA · GARÇONETE</div>
<div id="ck" class="abs" style="left:150px;top:190px"><svg width="420" height="420" viewBox="0 0 420 420"><circle cx="210" cy="210" r="196" fill="#F3E9C6" stroke="#12161E" stroke-width="12"/>${[...Array(12)].map((_,i)=>`<rect x="205" y="30" width="10" height="${i%3?18:34}" fill="#12161E" transform="rotate(${i*30} 210 210)"/>`).join('')}<line id="hm" x1="210" y1="210" x2="210" y2="70" stroke="#12161E" stroke-width="12" stroke-linecap="round"/><line id="hh" x1="210" y1="210" x2="210" y2="120" stroke="#E53E3E" stroke-width="14" stroke-linecap="round"/><circle cx="210" cy="210" r="16" fill="#12161E"/></svg></div>
<div id="nv" class="t" style="top:625px;font-size:100px;color:var(--r);text-shadow:0 6px 0 #000">NERVOSO</div>
<div id="ul" class="abs" style="left:110px;top:740px;opacity:0"><div style="padding:4px 24px;border:9px solid #E53E3E;border-radius:10px;color:#E53E3E;font-size:52px;white-space:nowrap;transform:rotate(-4deg);letter-spacing:.05em">ÚLTIMA VEZ VISTOS</div></div>`,
(q)=>{const ck=q('ck'),hm=q('hm'),hh=q('hh'),nv=q('nv'),ul=q('ul');ck.dataset.b='';
 return t=>{pop(ck,t,ss(8)+.05,.4);const sp=t>wt(9,1)?(t-wt(9,1))*330:0;hm.setAttribute('transform',`rotate(${sp} 210 210)`);hh.setAttribute('transform',`rotate(${sp/12+40} 210 210)`);
  pop(nv,t,wt(9,0),.35);const k=pr(t,wt(10,3),wt(10,3)+.25);ul.style.opacity=k>0?1:0;ul.style.transform=`scale(${k>0?1+(1-eo(k))*1.6:0})`}});

/* F1: o menino e a pipa */
scene(se(10),se(11),`${sky}${stars(20)}${hill(560)}
<div id="ch" class="t" style="top:150px;font-size:64px;letter-spacing:.14em;color:var(--y)">20 DE AGOSTO</div>
<div id="kt" class="abs" style="left:400px;top:230px"><svg width="200" height="300" viewBox="0 0 200 300"><polygon points="100,0 190,90 100,200 10,90" fill="#E53E3E" stroke="#12161E" stroke-width="6"/><path d="M100 0V200M10 90H190" stroke="#12161E" stroke-width="4"/><path d="M100 200Q70 240 100 260T100 300" stroke="#F5F1E6" stroke-width="5" fill="none"/></svg></div>
<svg class="abs" style="left:0;top:0" width="720" height="1000"><path id="ln" d="M500 470Q420 560 330 690" stroke="#F5F1E6" stroke-width="3" fill="none" opacity=".7"/></svg>
<div id="bo" class="abs" style="left:290px;top:640px">${person(70,'#F5F1E6')}</div>
<div id="mv" class="t" style="top:740px;font-size:84px;color:var(--tx);text-shadow:0 5px 0 #000">MORRO DO VINTÉM</div>`,
(q)=>{const ch=q('ch'),kt=q('kt'),mv=q('mv'),bo=q('bo');kt.dataset.b='';
 return t=>{pop(ch,t,ss(11),.3);kt.style.transform=`translate(${Math.sin(t*2)*14}px,${Math.sin(t*2.6)*10}px) rotate(${Math.sin(t*2)*6}deg)`;pop(mv,t,wt(11,8),.35)}});

/* F2: achados */
scene(se(11),se(13),`${sky}
<div class="t" style="top:150px;font-size:42px;letter-spacing:.2em;color:var(--mu)">ENCONTRADOS COM ELES</div>
<div id="a1" class="paper" style="left:100px;top:230px;width:520px;height:110px"><div class="t" style="left:0;width:520px;top:22px;font-size:68px;color:var(--ink)">TERNO</div></div>
<div id="a2" class="paper" style="left:100px;top:370px;width:520px;height:110px"><div class="t" style="left:0;width:520px;top:22px;font-size:68px;color:var(--ink)">CAPA DE CHUVA</div></div>
<div id="a3" class="paper" style="left:60px;top:510px;width:600px;height:130px;background:#C7CDD8"><div class="t" style="left:0;width:600px;top:30px;font-size:68px;color:var(--ink)">MÁSCARA DE CHUMBO</div></div>
<div id="uc" class="t" style="top:665px;font-size:46px;letter-spacing:.18em;color:var(--mu)">UMA EM CADA UM</div>
<div id="sl" class="abs" style="left:60px;top:750px;opacity:0"><div style="padding:4px 24px;border:9px solid #7BC47F;border-radius:10px;color:#7BC47F;font-size:66px;white-space:nowrap;transform:rotate(-3deg);letter-spacing:.04em">SEM SINAIS DE LUTA</div></div>`,
(q)=>{const a1=q('a1'),a2=q('a2'),a3=q('a3'),uc=q('uc'),sl=q('sl');a1.dataset.b='';a2.dataset.b='';a3.dataset.b='';
